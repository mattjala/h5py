---
name: Build
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true

# Adapted from https://github.com/matplotlib/matplotlib/blob/main/.github/workflows/nightlies.yml
# and https://cibuildwheel.pypa.io/en/stable/setup/#github-actions

# 1. Move as much as possible to pyproject.toml instead of using env vars
# 2. Use native compiling for macOS via -15-intel and -14 (arm) runners
# 3. Use native compiling for aarch64 using public beta runner
#    https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview/
# 4. On pushes, build and test all wheels and push as release artifacts (in
#    draft mode for main branch pushes).
# 5. On scheduled runs, build and test all wheels against
#    scientific-python-nightly-wheels NumPy dev, then upload the resulting wheels there.
# 6. On PRs, build against NumPy dev if [pip-pre] is in the commit message.

on:
  # Run daily at 1:23 UTC to upload nightly wheels to Anaconda Cloud
  schedule:
    - cron: '23 1 * * *'
  # Run on demand with workflow dispatch
  workflow_dispatch:
  # Run on all PRs
  pull_request:
  # Run on tags
  push:
    branches:
      - master
    tags:
      - '*'

permissions:
  actions: read

# Preview build: HDF5 at this commit (develop with internal threading, #6675)
# on every platform, and h5py's internal thread support forced on so a
# detection failure breaks the build instead of silently leaving it out.
env:
  HDF5_REF: ab5df5526c96a03bf1d89cea59603b77a239eac0
  H5PY_INTERNAL_THREADS: '1'

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.13
    - name: Build sdist
      run: |
        pipx run build --sdist
        pipx run twine check --strict dist/*
    - name: Upload sdist
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sdist
        path: dist/*.tar.gz

  build_wheels:
    name: 'Wheels: ${{ matrix.os }} ${{ matrix.arch }}'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: windows-11-arm
            arch: ARM64
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # get the non-merge commit for PRs
          persist-credentials: false

      # Get HDF5 outside of cibuildwheel so that we can set env vars via GITHUB_ENV
      # inside the HDF5-getting scripts and have them be in effect for the
      # cibuildwheel step.

      # Windows HDF5
      - name: Cache built HDF5 (Windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}-0-${{ env.HDF5_REF }}-${{ hashFiles('ci/cibw_before_all_windows.sh', 'ci/get_hdf5_win.py') }}
          path: cache/hdf5
        # When preparing to upload a release, always build HDF5 to avoid potential
        # cache-poisoning attacks.
        if: ${{ runner.os == 'Windows' && github.ref_type != 'tag' && github.event_name != 'schedule' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
        if: runner.os == 'Windows'
      - run: bash ./ci/cibw_before_all_windows.sh "${{ github.workspace }}"
        env:
          ARCH: ${{ matrix.arch }}
        if: runner.os == 'Windows'

      # macOS HDF5
      - name: Cache built HDF5 (Mac)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}-0-${{ env.HDF5_REF }}-${{ hashFiles('ci/cibw_before_all_macos.sh', 'ci/get_hdf5_if_needed.sh') }}
          path: cache/hdf5
        # When preparing to upload a release, always build HDF5 to avoid potential
        # cache-poisoning attacks.
        if: ${{ runner.os == 'macOS' && github.ref_type != 'tag' && github.event_name != 'schedule' }}
      - run: bash ./ci/cibw_before_all_macos.sh "${{ github.workspace }}"
        if: runner.os == 'macOS'

      # Triage build
      - run: bash ./ci/triage_build.sh "${{ matrix.arch }}" "${{ github.event.pull_request.head.sha || github.sha }}"

      # For nightlies, also build a future-compatible abi3 wheel
      # this comes first to avoid inter-job pollution which then fails abi3audit
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        if: github.event_name == 'schedule' ||
            (
              (
                github.event_name == 'pull_request' ||
                github.event_name == 'push'
              ) &&
              contains( env.TIP_COMMIT_MSG , '[pip-pre]' )
            )
        env:
          H5PY_LIMITED_API: 1
          CIBW_BUILD: 'cp314-* cp315t-*'
          CIBW_ENABLE: cpython-prerelease
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ''
          PIP_EXTRA_INDEX_URL: 'https://pypi.anaconda.org/scientific-python-nightly-wheels/simple'
          PIP_PRE: '1'

      # Now actually build the wheels
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ''

      - run: python ./ci/bundle_hdf5_whl.py wheelhouse
        if: runner.os == 'Windows'

      # And upload the results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  check-minimal-build:
    # this job isn't meant to upload anything, it's only a sanity check
    name: Check minimal build requirements (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cibw_before_build: pip install --only-binary ':all:' 'numpy==1.25.0' 'Cython==3.0.0' 'setuptools==77.0.1' 'pkgconfig==1.5.5'
            label: 'numpy-min'
          - os: ubuntu-latest
            arch: x86_64
            cibw_before_build: pip install --only-binary ':all:' 'numpy==2.0.0' 'Cython==3.0.0' 'setuptools==77.0.1' 'pkgconfig==1.5.5'
            label: 'cython-min + numpy 2.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # get the non-merge commit for PRs
          persist-credentials: false

      # Triage build
      - run: bash ./ci/triage_build.sh "${{ matrix.arch }}" "${{ github.event.pull_request.head.sha || github.sha }}"

      # Now actually build the wheels
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp310-*"
          CIBW_BEFORE_BUILD: ${{ matrix.cibw_before_build }}
          CIBW_BUILD_FRONTEND: 'pip; args: --no-build-isolation'
          ONLY_MINDEPS_TESTS: "1"

  upload_artifacts:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    needs:
      - build_sdist
      - build_wheels
      - check-minimal-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist/
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "h5py $TAG: HDF5 internal threading preview"
          --notes-file ci/preview/RELEASE_NOTES.md
